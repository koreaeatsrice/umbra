name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Format
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17 (Zulu, build toolchain)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"

      - name: Export the JDK 17 path for Gradle toolchains
        shell: bash
        run: echo "JAVA_HOME_17_X64=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build (includes Spotless formatting + Checkstyle)
        run: ./gradlew build --no-daemon

      - name: Upload release jar
        uses: actions/upload-artifact@v7
        with:
          name: umbra-jar
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  smoke:
    name: Server smoke test (Umbra must arm)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17 (Zulu, build toolchain)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"

      - name: Export the JDK 17 path for Gradle toolchains
        shell: bash
        run: echo "JAVA_HOME_17_X64=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Prepare a throwaway server
        run: |
          mkdir -p run/server
          echo "eula=true" > run/server/eula.txt
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-name=umbra-ci\nspawn-protection=0\nmax-players=2\nview-distance=4\n' > run/server/server.properties
          printf 'online-mode=false\n' > run/server.properties

      - name: Boot the dev server (bounded) and verify Umbra armed
        run: |
          set -u
          (timeout 900 ./gradlew runServer --no-daemon > server.log 2>&1 || true) &
          booted=0
          for _ in $(seq 1 130); do
            if grep -q "Done (" server.log 2>/dev/null; then booted=1; break; fi
            sleep 6
          done
          echo "=== umbra log lines ==="
          grep -E "Umbra:" server.log || true
          if [ "$booted" != "1" ]; then
            echo "::error::server never finished booting"
            tail -150 server.log
            exit 1
          fi
          grep -q "Umbra: ARMED" server.log || { echo "::error::Umbra never reported ARMED"; exit 1; }
          if grep -qE "Umbra:.*DISARMED" server.log; then
            echo "::error::Umbra reported DISARMED"
            exit 1
          fi

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: umbra-smoke-server-log
          path: server.log
          if-no-files-found: warn

  release-engine-tests:
    name: Release Engine Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Run release-engine unit tests
        working-directory: .github/scripts
        run: python3 -m unittest -v test_release